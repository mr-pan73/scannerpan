<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Linear Gradients for Breeze Aesthetics -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b4045" />
      <stop offset="100%" stop-color="#232629" />
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e545a" />
      <stop offset="100%" stop-color="#31363b" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b1e20" />
      <stop offset="100%" stop-color="#272b30" />
    </linearGradient>
    <linearGradient id="breezeBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3daee9" />
      <stop offset="50%" stop-color="#29b6f6" />
      <stop offset="100%" stop-color="#3daee9" />
    </linearGradient>
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3daee9" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#29b6f6" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Scanner Base Body -->
  <rect x="14" y="38" width="100" height="74" rx="8" fill="url(#bodyGrad)" stroke="#4e545a" stroke-width="2" />

  <!-- Scanner Glass Platen -->
  <rect x="22" y="46" width="84" height="54" rx="4" fill="url(#glassGrad)" stroke="#1a1c1e" stroke-width="1.5" />

  <!-- Document on Platen (Paper) -->
  <rect x="32" y="52" width="46" height="42" rx="2" fill="#eff0f1" opacity="0.9" />
  <!-- Document Text Lines -->
  <line x1="38" y1="59" x2="68" y2="59" stroke="#7f8c8d" stroke-width="2" stroke-linecap="round" />
  <line x1="38" y1="65" x2="72" y2="65" stroke="#7f8c8d" stroke-width="2" stroke-linecap="round" />
  <line x1="38" y1="71" x2="64" y2="71" stroke="#7f8c8d" stroke-width="2" stroke-linecap="round" />
  <line x1="38" y1="77" x2="70" y2="77" stroke="#3daee9" stroke-width="2" stroke-linecap="round" />

  <!-- Laser Scan Beam & Glow Effect -->
  <rect x="24" y="68" width="80" height="12" fill="url(#scanBeam)" />
  <line x1="22" y1="68" x2="106" y2="68" stroke="url(#breezeBlue)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Open Scanner Lid (Angled Lid) -->
  <path d="M 14,38 L 26,14 L 112,14 L 114,38 Z" fill="url(#lidGrad)" stroke="#565d64" stroke-width="1.5" />
  <!-- Lid Underside Cushion / White Mat -->
  <polygon points="28,36 37,18 103,18 100,36" fill="#eff0f1" opacity="0.85" />

  <!-- Status LED on Front Panel -->
  <circle cx="28" cy="103" r="3" fill="#27ae60" filter="url(#glow)" />
  <circle cx="38" cy="103" r="2.5" fill="#3daee9" />
  <!-- Front Panel Accent Strip -->
  <line x1="50" y1="103" x2="104" y2="103" stroke="#444a50" stroke-width="2" stroke-linecap="round" />
</svg>
